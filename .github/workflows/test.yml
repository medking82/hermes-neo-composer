name: Checks
on:
  push:
    branches: [main, v0.5-durable]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Service unit tests
        run: cd service && python3 -m unittest discover -v
      - name: Desktop plugin tests
        run: node --check desktop-plugin/neo-composer/plugin.js && node --test desktop-plugin/*.test.mjs
      - name: Catalog package tests
        run: |
          cd catalog
          python3 -m pip install fastapi httpx
          python3 -m unittest discover -s tests -v
          node --check desktop/plugin.js && node --test tests/plugin.test.mjs
      - name: Advanced desktop installer tests
        run: python3 -m unittest discover -s deploy -v
      - name: Python syntax
        run: python3 -m compileall -q service compat catalog
      - name: Shell syntax
        run: sh -n deploy/install.sh
