name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Service unit tests
        run: cd service && python3 -B -m unittest discover -s . -v
      - name: Desktop plugin tests
        run: node --check desktop-plugin/neo-composer/plugin.js && node --test desktop-plugin/plugin.test.mjs
      - name: Python syntax
        run: python3 -B -m compileall -q service compat scripts
      - name: Shell syntax
        run: sh -n deploy/install.sh
      - name: Offline release entrypoint contracts
        run: python3 -B -m unittest discover -s tests -v
      # Full shared qualification is an explicit local WSL step (README).
      # Its pinned private sibling checkout is not available to this public job.
